<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Subodh Paudel</title>
    <meta
      name="description"
      content="Contact Subodh Paudel, a web developer in Pokhara, Nepal, about projects, collaboration, or web development opportunities."
    />
    <link rel="canonical" href="https://subodh-paudel.com.np/contact.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css"
    />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <header id="hd"></header>

    <main class="wrap">
      <section class="cg">
        <div>
          <span class="chip">Get In Touch</span>
          <h1 class="m">Let's Work Together</h1>
          <p class="lead">
            Have a project, idea or just want to say hello? Feel free to reach
            out. I'd love to hear from you.
          </p>

          <div class="ci">
            <i data-i="mail"></i>
            <span><b>Email</b>subodhpaudel63@gmail.com</span>
          </div>
          <div class="ci">
            <i data-i="phone"></i>
            <span><b>Phone</b>+977 9816543210</span>
          </div>
          <div class="ci">
            <i data-i="pin"></i>
            <span><b>Location</b>Pokhara, Nepal</span>
          </div>
          <div class="ci">
            <i data-i="user"></i>
            <span>
              <b>Social Media</b>
              <span
                class="soc"
                style="margin: 4px 0 0; font-size: 15px"
                data-soc
              ></span>
            </span>
          </div>
        </div>

        <div style="position: relative">
          <form class="form" id="cf">
            <label
              >Full Name *
              <input name="name" placeholder="Your name" required />
            </label>
            <label
              >Email Address *
              <input
                name="email"
                type="email"
                placeholder="Your email"
                required
              />
            </label>
            <label
              >Message *
              <textarea
                name="message"
                placeholder="Your message..."
                required
              ></textarea>
            </label>
            <button class="btn dark" type="submit">
              Send Message <i data-i="arr"></i>
            </button>
            <p class="sm" style="margin-top: 12px; font-size: 10px">
              I'll get back to you as soon as possible.
            </p>
          </form>
          <span class="note" style="right: 0; bottom: -70px"
            >Let's build<br />something great</span
          >
        </div>
      </section>
    </main>

    <footer id="ft"></footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/effects.js"></script>
  </body>
</html>
